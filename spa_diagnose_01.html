
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SharePoint SPA Test Page</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Calibri, Arial, sans-serif;
    background: #f5f5f5;
    color: #3D3D3D;
    padding: 24px;
  }
  h1 {
    font-family: Arial, sans-serif;
    color: #4F2170;
    margin-bottom: 8px;
    font-size: 1.6rem;
  }
  .subtitle {
    color: #777;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    padding: 20px;
  }
  .card h2 {
    font-size: 1rem;
    color: #4F2170;
    margin-bottom: 12px;
    border-bottom: 2px solid #E18719;
    padding-bottom: 6px;
  }
  canvas, #apex-chart { width: 100% !important; }

  /* Diagnostics */
  .diagnostics {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    padding: 20px;
  }
  .diagnostics h2 {
    font-size: 1rem;
    color: #4F2170;
    margin-bottom: 12px;
    border-bottom: 2px solid #E18719;
    padding-bottom: 6px;
  }
  .test-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
  }
  .test-row:last-child { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: bold;
    color: #fff;
  }
  .badge.pass { background: #287819; }
  .badge.fail { background: #A52323; }
  .badge.warn { background: #E18719; }
  .badge.wait { background: #999; }

  .summary-bar {
    margin-top: 16px;
    padding: 12px;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
    font-size: 1rem;
  }
  .summary-bar.all-pass { background: #e8f5e3; color: #287819; }
  .summary-bar.has-fail { background: #fde8e8; color: #A52323; }
</style>
</head>
<body>

<h1>SharePoint SPA Test Page</h1>
<p class="subtitle">Upload this file to your SharePoint Document Library and open it in the browser to verify SPA compatibility.</p>

<!-- Charts -->
<div class="grid">
  <div class="card">
    <h2>Chart.js (CDN)</h2>
    <canvas id="chartjs-canvas" height="220"></canvas>
    <p id="chartjs-error" style="color:#A52323; display:none; margin-top:8px; font-size:0.85rem;"></p>
  </div>
  <div class="card">
    <h2>ApexCharts (CDN)</h2>
    <div id="apex-chart" style="min-height:220px;"></div>
    <p id="apex-error" style="color:#A52323; display:none; margin-top:8px; font-size:0.85rem;"></p>
  </div>
</div>

<!-- Diagnostics -->
<div class="diagnostics">
  <h2>Diagnostic Checks</h2>
  <div id="test-list"></div>
  <div id="summary-bar" class="summary-bar" style="display:none;"></div>
</div>

<!-- Load CDN libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3"></script>

<script>
(function () {
  // ── Helpers ──
  var testList = document.getElementById('test-list');
  var results = [];

  function addTest(name, status, detail) {
    results.push({ name: name, status: status });
    var row = document.createElement('div');
    row.className = 'test-row';
    row.innerHTML =
      '<span>' + name + (detail ? ' <span style="color:#999;font-size:0.8rem;">— ' + detail + '</span>' : '') + '</span>' +
      '<span class="badge ' + status + '">' + status.toUpperCase() + '</span>';
    testList.appendChild(row);
  }

  function showSummary() {
    var bar = document.getElementById('summary-bar');
    var fails = results.filter(function (r) { return r.status === 'fail'; }).length;
    bar.style.display = 'block';
    if (fails === 0) {
      bar.className = 'summary-bar all-pass';
      bar.textContent = 'All checks passed — your SharePoint environment supports this SPA.';
    } else {
      bar.className = 'summary-bar has-fail';
      bar.textContent = fails + ' check(s) failed — see details above.';
    }
  }

  // ── Test 1: Protocol ──
  var proto = location.protocol;
  if (proto === 'https:') {
    addTest('Protocol', 'pass', 'Served over HTTPS');
  } else if (proto === 'http:') {
    addTest('Protocol', 'warn', 'HTTP — CDN scripts may be blocked (mixed content)');
  } else {
    addTest('Protocol', 'warn', proto + ' (local file — CDN needs internet)');
  }

  // ── Test 2: JavaScript execution ──
  addTest('JavaScript execution', 'pass', 'This script is running');

  // ── Test 3: Chart.js loaded ──
  if (typeof Chart !== 'undefined') {
    addTest('Chart.js CDN', 'pass', 'v' + Chart.version);
  } else {
    addTest('Chart.js CDN', 'fail', 'Library not loaded — CDN may be blocked');
  }

  // ── Test 4: ApexCharts loaded ──
  if (typeof ApexCharts !== 'undefined') {
    addTest('ApexCharts CDN', 'pass', 'Loaded successfully');
  } else {
    addTest('ApexCharts CDN', 'fail', 'Library not loaded — CDN may be blocked');
  }

  // ── Test 5: localStorage ──
  try {
    localStorage.setItem('__sp_test', '1');
    localStorage.removeItem('__sp_test');
    addTest('localStorage', 'pass', 'Available');
  } catch (e) {
    addTest('localStorage', 'warn', 'Blocked — some SPAs may not persist state');
  }

  // ── Test 6: sessionStorage ──
  try {
    sessionStorage.setItem('__sp_test', '1');
    sessionStorage.removeItem('__sp_test');
    addTest('sessionStorage', 'pass', 'Available');
  } catch (e) {
    addTest('sessionStorage', 'warn', 'Blocked');
  }

  // ── Test 7: Inline styles ──
  var el = document.createElement('div');
  el.style.color = 'rgb(79, 33, 112)';
  document.body.appendChild(el);
  var computed = getComputedStyle(el).color;
  document.body.removeChild(el);
  if (computed === 'rgb(79, 33, 112)') {
    addTest('Inline styles', 'pass', 'Rendered correctly');
  } else {
    addTest('Inline styles', 'fail', 'Stripped or overridden by CSP');
  }

  // ── Test 8: Dynamic DOM ──
  try {
    var d = document.createElement('div');
    d.id = '__sp_dom_test';
    d.textContent = 'ok';
    document.body.appendChild(d);
    var found = document.getElementById('__sp_dom_test');
    document.body.removeChild(d);
    addTest('Dynamic DOM manipulation', found ? 'pass' : 'fail', found ? 'Working' : 'Element not found');
  } catch (e) {
    addTest('Dynamic DOM manipulation', 'fail', e.message);
  }

  // ── Render Chart.js chart ──
  try {
    if (typeof Chart !== 'undefined') {
      var ctx = document.getElementById('chartjs-canvas').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
          datasets: [{
            label: 'Sample Data',
            data: [12, 19, 8, 15, 22],
            backgroundColor: ['#4F2170', '#E18719', '#287819', '#2D6EAA', '#A52323']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });
      addTest('Chart.js rendering', 'pass', 'Bar chart drawn');
    }
  } catch (e) {
    document.getElementById('chartjs-error').style.display = 'block';
    document.getElementById('chartjs-error').textContent = 'Chart.js render error: ' + e.message;
    addTest('Chart.js rendering', 'fail', e.message);
  }

  // ── Render ApexCharts chart ──
  try {
    if (typeof ApexCharts !== 'undefined') {
      var options = {
        chart: { type: 'line', height: 220, toolbar: { show: false } },
        series: [{ name: 'Trend', data: [10, 25, 15, 30, 20, 35] }],
        xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'] },
        colors: ['#4F2170'],
        stroke: { width: 3, curve: 'smooth' },
        markers: { size: 5, colors: ['#E18719'] }
      };
      var chart = new ApexCharts(document.getElementById('apex-chart'), options);
      chart.render();
      addTest('ApexCharts rendering', 'pass', 'Line chart drawn');
    }
  } catch (e) {
    document.getElementById('apex-error').style.display = 'block';
    document.getElementById('apex-error').textContent = 'ApexCharts render error: ' + e.message;
    addTest('ApexCharts rendering', 'fail', e.message);
  }

  // ── Done ──
  showSummary();
})();
</script>

</body>
</html>
